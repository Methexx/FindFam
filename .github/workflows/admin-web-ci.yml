name: Admin Web CI

on:
  pull_request:
    paths:
      - 'apps/admin-web/**'
      - 'packages/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint --workspace=@findfam/admin-web
      # TODO: Sprint 2 — add build step, Vercel preview deployment
