name: Admin Web CI

on:
  pull_request:
    paths:
      - 'apps/admin-web/**'
      - 'packages/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint --workspace=@findfam/admin-web
      - run: npm run build --workspace=@findfam/admin-web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_WS_URL: ws://localhost:3000
      # Vercel preview deployments are account/infra setup, out of scope
      # for this pass — see docs/10-production-readiness.md.
