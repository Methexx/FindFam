name: Backend CI

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'packages/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint --workspace=@findfam/backend
      # TODO: Sprint 1 — add test and build steps
      # No CI deploy step needed — Render deploys are triggered by its own
      # git-push integration, not a GitHub Actions step (see render.yaml).
